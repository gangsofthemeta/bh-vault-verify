[package]
name = "bh_vault"
version = "0.1.0"
description = "Bloodhound Manual LP Terminal vault: PDA-owned Meteora DLMM positions, fees owed, NFT fee tier, keeper cost repayment"
edition = "2021"
rust-version = "1.84"

[lib]
crate-type = ["cdylib", "lib"]
name = "bh_vault"

[features]
default = ["no-idl", "no-log-ix-name"]
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "=0.32.1"
solana-sha256-hasher = "=2.3.0"

[lints.rust]
unexpected_cfgs = { level = "allow" }
